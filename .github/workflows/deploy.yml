name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
      - prod-test
  workflow_dispatch:
    inputs:
      clean:
        description: 'Wipe MySQL volume and redeploy from scratch (DataSeeder reseeds)'
        type: boolean
        default: false
      wipe_uploads:
        description: 'Also wipe uploads volume (only with clean)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  #IMAGE_NAME: ${{ github.repository }}
  IMAGE_NAME: orbitntnu/nettdetektivene

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          pull: false
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.repository == 'OrbitNTNU/nettdetektivene'
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4

      - name: Deploy to Production
        env:
          CLEAN: ${{ inputs.clean }}
          WIPE_UPLOADS: ${{ inputs.wipe_uploads }}
        run: |
          ssh -o StrictHostKeyChecking=no orbit@129.241.100.67 "docker login ghcr.io -u tritacle --password-stdin" <<< "${{ secrets.PAT_TOKEN }}"
          if [ "$CLEAN" = "true" ]; then
            echo "Running CLEAN deploy (wipe_uploads=$WIPE_UPLOADS)..."
            ssh -o StrictHostKeyChecking=no orbit@129.241.100.67 \
              "cd ~/services.devops/nettdetektivene && WIPE_UPLOADS=$WIPE_UPLOADS bash -s" \
              < deployment/clean-deploy.sh
          else
            ssh -o StrictHostKeyChecking=no orbit@129.241.100.67 \
              "cd ~/services.devops/nettdetektivene && bash deployment/quick-deploy.sh"
          fi

      - name: Sync nginx config
        run: |
          scp -o StrictHostKeyChecking=no deployment/nginx.conf orbit@129.241.100.67:/tmp/nettdetektivene-nginx.conf
          ssh -o StrictHostKeyChecking=no orbit@129.241.100.67 'bash -s' <<'EOF'
          set -e
          SRC=/tmp/nettdetektivene-nginx.conf
          DST=/etc/nginx/conf.d/nettdetektivene.conf
          if sudo -n cmp -s "$SRC" "$DST" 2>/dev/null; then
            echo "nginx config unchanged, skipping reload."
          else
            echo "nginx config changed, applying..."
            sudo -n cp "$SRC" "$DST"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "nginx reloaded."
          fi
          rm -f "$SRC"
          EOF
