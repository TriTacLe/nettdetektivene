name: Sync to Orbit

on:
  push:
    branches:
      - main
      - dev

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to orbit
        run: |
          git remote add orbit https://x-access-token:${{ secrets.ORBIT_PAT }}@github.com/OrbitNTNU/nettdetektivene.git
          git push orbit ${{ github.ref_name }}
