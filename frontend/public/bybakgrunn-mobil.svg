<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1530"/>
      <stop offset="40%" stop-color="#0f1a3d"/>
      <stop offset="80%" stop-color="#2a2350"/>
      <stop offset="100%" stop-color="#3d2b5c"/>
    </linearGradient>

    <linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2d4a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1a30" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2c38"/>
      <stop offset="100%" stop-color="#0d141d"/>
    </linearGradient>
    <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2a25"/>
      <stop offset="100%" stop-color="#0d1410"/>
    </linearGradient>
    <linearGradient id="hill4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2418"/>
      <stop offset="100%" stop-color="#0a0e08"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#fff8d8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff8d8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe4a8" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffe4a8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffe4a8" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky -->
  <rect width="900" height="1800" fill="url(#skyGradient)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="60" r="1.2" opacity="0.7"/>
    <circle cx="180" cy="30" r="1" opacity="0.6"/>
    <circle cx="280" cy="80" r="1.4" opacity="0.8"/>
    <circle cx="380" cy="40" r="1" opacity="0.5"/>
    <circle cx="500" cy="100" r="1.3" opacity="0.7"/>
    <circle cx="600" cy="50" r="1" opacity="0.6"/>
    <circle cx="720" cy="120" r="1.5" opacity="0.9"/>
    <circle cx="820" cy="40" r="1" opacity="0.5"/>
    <circle cx="100" cy="160" r="1" opacity="0.5"/>
    <circle cx="240" cy="200" r="1.2" opacity="0.7"/>
    <circle cx="380" cy="180" r="1" opacity="0.6"/>
    <circle cx="500" cy="220" r="1.3" opacity="0.8"/>
    <circle cx="640" cy="180" r="1" opacity="0.5"/>
    <circle cx="780" cy="220" r="1.2" opacity="0.7"/>
    <circle cx="160" cy="100" r="2.2" opacity="0.95"/>
    <circle cx="540" cy="60" r="2.4" opacity="0.9"/>
    <circle cx="350" cy="240" r="2" opacity="0.85"/>
  </g>

  <!-- Moon -->
  <circle cx="200" cy="180" r="170" fill="url(#moonGlow)"/>
  <g transform="translate(200, 180)">
    <circle cx="0" cy="0" r="50" fill="#fff8d8" opacity="0.95"/>
    <circle cx="18" cy="-6" r="46" fill="#0f1a3d"/>
  </g>

  <!-- Distant city silhouette -->
  <g fill="url(#cityFar)">
    <polygon points="
      0,420 0,360
      40,360 40,335 80,335 80,355 130,355 130,320 180,320 180,345 230,345 230,325 280,325 280,355
      330,355 330,330 380,330 380,310 430,310 430,340 480,340 480,320 530,320 530,355 580,355 580,330
      630,330 630,355 680,355 680,330 730,330 730,360 780,360 780,335 830,335 830,355 880,355 880,360
      900,360 900,420
    "/>
  </g>

  <g fill="#5a7eb0" opacity="0.55">
    <rect x="50" y="345" width="3" height="5"/>
    <rect x="195" y="335" width="3" height="5"/>
    <rect x="345" y="320" width="3" height="5"/>
    <rect x="490" y="330" width="3" height="5"/>
    <rect x="640" y="340" width="3" height="5"/>
    <rect x="790" y="345" width="3" height="5"/>
  </g>
  <g fill="#ffe488" opacity="0.7">
    <rect x="245" y="335" width="3" height="5"/>
    <rect x="445" y="325" width="3" height="5"/>
    <rect x="690" y="345" width="3" height="5"/>
    <rect x="840" y="345" width="3" height="5"/>
  </g>

  <!-- Hill 1 -->
  <path d="M 0 480
           Q 100 470, 200 475
           Q 300 480, 400 470
           Q 500 460, 600 450
           Q 680 445, 750 450
           Q 830 460, 900 470
           L 900 640
           L 0 640 Z"
        fill="url(#hill1)"/>

  <g>
    <ellipse cx="100" cy="490" rx="16" ry="20" fill="#0d1410"/>
    <ellipse cx="100" cy="480" rx="12" ry="12" fill="#162018"/>
    <ellipse cx="280" cy="485" rx="16" ry="20" fill="#0d1410"/>
    <ellipse cx="280" cy="475" rx="12" ry="12" fill="#162018"/>
    <ellipse cx="500" cy="470" rx="16" ry="20" fill="#0d1410"/>
    <ellipse cx="500" cy="460" rx="12" ry="12" fill="#162018"/>
    <ellipse cx="850" cy="478" rx="16" ry="20" fill="#0d1410"/>
    <ellipse cx="850" cy="468" rx="12" ry="12" fill="#162018"/>
  </g>

  <!-- Hill 2 -->
  <path d="M 0 640
           Q 100 625, 200 615
           Q 280 605, 350 615
           Q 450 635, 550 660
           Q 650 680, 750 690
           Q 830 695, 900 700
           L 900 900
           L 0 900 Z"
        fill="url(#hill2)"/>

  <g>
    <ellipse cx="80" cy="650" rx="18" ry="22" fill="#0f1c14"/>
    <ellipse cx="80" cy="638" rx="14" ry="14" fill="#1a2820"/>
    <ellipse cx="380" cy="635" rx="18" ry="22" fill="#0f1c14"/>
    <ellipse cx="380" cy="623" rx="14" ry="14" fill="#1a2820"/>
    <ellipse cx="600" cy="670" rx="16" ry="20" fill="#0f1c14"/>
    <ellipse cx="600" cy="658" rx="12" ry="12" fill="#1a2820"/>
    <ellipse cx="800" cy="695" rx="18" ry="22" fill="#0f1c14"/>
    <ellipse cx="800" cy="683" rx="14" ry="14" fill="#1a2820"/>
  </g>

  <!-- Hill 3 -->
  <path d="M 0 900
           Q 100 920, 200 935
           Q 300 940, 400 925
           Q 500 905, 600 900
           Q 680 900, 750 920
           Q 830 940, 900 955
           L 900 1170
           L 0 1170 Z"
        fill="url(#hill3)"/>

  <g>
    <ellipse cx="120" cy="950" rx="20" ry="24" fill="#101810"/>
    <ellipse cx="120" cy="936" rx="15" ry="15" fill="#1a2418"/>
    <ellipse cx="320" cy="940" rx="22" ry="26" fill="#101810"/>
    <ellipse cx="320" cy="924" rx="17" ry="17" fill="#1a2418"/>
    <ellipse cx="500" cy="925" rx="20" ry="24" fill="#101810"/>
    <ellipse cx="500" cy="911" rx="15" ry="15" fill="#1a2418"/>
    <ellipse cx="840" cy="960" rx="20" ry="24" fill="#101810"/>
    <ellipse cx="840" cy="946" rx="15" ry="15" fill="#1a2418"/>
  </g>

  <!-- Hill 4 (foreground) -->
  <path d="M 0 1170
           Q 100 1180, 200 1200
           Q 300 1220, 400 1240
           Q 500 1260, 600 1270
           Q 700 1280, 800 1280
           Q 850 1280, 900 1275
           L 900 1800
           L 0 1800 Z"
        fill="url(#hill4)"/>

  <!-- General foreground grass tufts -->
  <g fill="#2a3d28" opacity="0.7">
    <path d="M 200 1720 l -3 -10 l 2 0 l 1 7 l 2 -8 l 2 0 l -1 9 z"/>
    <path d="M 600 1700 l -3 -10 l 2 0 l 1 7 l 2 -8 l 2 0 l -1 9 z"/>
  </g>

  <!-- Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="900" height="1800" fill="url(#vignette)"/>
</svg>
