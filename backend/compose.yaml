services:
  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    container_name: nettdetektivene-db
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - nettdetektivene_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nettdetektivene-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nettdetektivene_mysql_data: